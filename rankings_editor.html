<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Roster & Rankings Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1e29 0%, #10121a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #232733;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            padding: 24px;
            border: 1px solid #33394a;
        }

        h1 {
            text-align: center;
            color: #f7fafc;
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        #loadBtn {
            background: #d97706;
            color: white;
        }
        #loadBtn:hover { background: #b45309; }

        #saveBtn {
            background: #2563eb;
            color: white;
        }
        #saveBtn:hover { background: #1d4ed8; }

        #copyBtn {
            background: #059669;
            color: white;
        }
        #copyBtn:hover { background: #047857; }

        .feedback {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            font-weight: 500;
        }

        .feedback.success {
            background: #064e3b;
            color: #6ee7b7;
            display: block;
            border: 1px solid #059669;
        }

        .feedback.error {
            background: #7f1d1d;
            color: #fca5a5;
            display: block;
            border: 1px solid #dc2626;
        }

        #playerList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-item {
            background: #2b3040;
            border: 1px solid #3c4357;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: grab;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
            user-select: none;
        }

        .player-item:hover {
            background: #32384a;
            border-color: #4f576e;
        }

        .player-item.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .player-item.drag-over {
            border-color: #3b82f6;
            background: #1e293b;
        }

        .rank-number {
            background: #3b82f6;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .player-name {
            font-size: 15px;
            color: #f1f5f9;
            font-weight: 600;
        }

        .player-meta {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 11px;
        }

        .tag-team {
            background: #374151;
            color: #93c5fd;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .tag-pos {
            background: #1f2937;
            color: #9ca3af;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .quick-controls {
            display: flex;
            gap: 4px;
        }

        .move-btn {
            background: #1e222d;
            color: #94a3b8;
            border: 1px solid #33394a;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .move-btn:hover:not(:disabled) {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .move-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .drag-handle {
            color: #4b5563;
            font-size: 18px;
            padding-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rankings & Roster Editor</h1>
        <p class="subtitle">Use ▲ / ▼ buttons or drag and drop to re-order players</p>

        <div class="button-container">
            <button id="loadBtn">📂 Open File</button>
            <button id="saveBtn">💾 Save File</button>
            <button id="copyBtn">📋 Copy JSON</button>
        </div>
        <input type="file" id="fileInput" accept=".json" style="display: none;">

        <div id="feedback" class="feedback"></div>

        <ul id="playerList"></ul>
    </div>

    <script>
        let players = [];
        let loadedFormat = 'roster'; // 'roster' (array of objects) or 'dict' ({"name": rank})
        let fileHandle = null;

        function initializeData(data) {
            if (Array.isArray(data)) {
                loadedFormat = 'roster';
                // Sort by rank if existing, or use array order
                players = [...data].sort((a, b) => (a.rank || 9999) - (b.rank || 9999));
            } else if (typeof data === 'object' && data !== null) {
                loadedFormat = 'dict';
                players = Object.entries(data)
                    .map(([name, rank]) => ({ name, rank: Number(rank) }))
                    .sort((a, b) => a.rank - b.rank);
            } else {
                throw new Error("Unrecognized JSON format");
            }
            renderPlayers();
        }

        function renderPlayers() {
            const list = document.getElementById('playerList');
            list.innerHTML = '';

            if (players.length === 0) {
                list.innerHTML = '<li style="text-align:center; padding: 40px; color: #64748b; font-size: 14px;">Open your roster.json or rankings.json to begin</li>';
                return;
            }

            players.forEach((player, index) => {
                const li = document.createElement('li');
                li.className = 'player-item';
                li.draggable = true;
                li.dataset.index = index;

                const teamTag = player.team ? `<span class="tag-team">${player.team}</span>` : '';
                const posTag = player.eligible ? `<span class="tag-pos">${player.eligible.join('/')}</span>` : '';

                li.innerHTML = `
                    <div class="rank-number">${index + 1}</div>
                    <div class="player-info">
                        <div class="player-name">${player.name}</div>
                        ${(teamTag || posTag) ? `<div class="player-meta">${teamTag}${posTag}</div>` : ''}
                    </div>
                    <div class="quick-controls">
                        <button class="move-btn" onclick="movePlayer(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
                        <button class="move-btn" onclick="movePlayer(${index}, 1)" ${index === players.length - 1 ? 'disabled' : ''}>▼</button>
                    </div>
                    <div class="drag-handle">⋮⋮</div>
                `;

                // Drag event bindings
                li.addEventListener('dragstart', handleDragStart);
                li.addEventListener('dragover', handleDragOver);
                li.addEventListener('drop', handleDrop);
                li.addEventListener('dragenter', handleDragEnter);
                li.addEventListener('dragleave', handleDragLeave);
                li.addEventListener('dragend', handleDragEnd);

                list.appendChild(li);
            });
        }

        // Quick button move
        window.movePlayer = function(index, delta) {
            const target = index + delta;
            if (target < 0 || target >= players.length) return;
            const temp = players[index];
            players.splice(index, 1);
            players.splice(target, 0, temp);
            renderPlayers();
        };

        // Drag & Drop
        let draggedIndex = null;

        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter() {
            this.classList.add('drag-over');
        }

        function handleDragLeave() {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.stopPropagation();
            this.classList.remove('drag-over');
            const targetIndex = parseInt(this.dataset.index);

            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                const moved = players[draggedIndex];
                players.splice(draggedIndex, 1);
                players.splice(targetIndex, 0, moved);
                renderPlayers();
            }
            return false;
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            document.querySelectorAll('.player-item').forEach(el => el.classList.remove('drag-over'));
        }

        function getExportPayload() {
            if (loadedFormat === 'roster') {
                return players.map((p, idx) => ({ ...p, rank: idx + 1 }));
            } else {
                const rankingsDict = {};
                players.forEach((p, idx) => { rankingsDict[p.name] = idx + 1; });
                return rankingsDict;
            }
        }

        // Open File (File System Access API with fallback)
        document.getElementById('loadBtn').addEventListener('click', async () => {
            if (window.showOpenFilePicker) {
                try {
                    [fileHandle] = await window.showOpenFilePicker({
                        types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
                    });
                    const file = await fileHandle.getFile();
                    const text = await file.text();
                    initializeData(JSON.parse(text));
                    showFeedback(`Loaded ${players.length} players from ${file.name}`);
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    initializeData(JSON.parse(event.target.result));
                    showFeedback(`Loaded ${players.length} players from ${file.name}`);
                } catch {
                    showFeedback('Error: Invalid JSON file', true);
                }
            };
            reader.readAsText(file);
        });

        // Save File (Writes directly back to file if opened via File System API)
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const payload = getExportPayload();
            const text = JSON.stringify(payload, null, 2);

            if (fileHandle && fileHandle.createWritable) {
                try {
                    const writable = await fileHandle.createWritable();
                    await writable.write(text);
                    await writable.close();
                    showFeedback('Saved directly to file!');
                    return;
                } catch (e) {
                    console.warn("Direct write failed, falling back to download", e);
                }
            }

            const blob = new Blob([text], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = loadedFormat === 'roster' ? 'roster.json' : 'rankings.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showFeedback('File downloaded to Downloads folder');
        });

        // Copy JSON
        document.getElementById('copyBtn').addEventListener('click', async () => {
            const payload = getExportPayload();
            await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
            showFeedback('Copied JSON to clipboard!');
        });

        function showFeedback(msg, isError = false) {
            const fb = document.getElementById('feedback');
            fb.textContent = msg;
            fb.className = `feedback ${isError ? 'error' : 'success'}`;
            setTimeout(() => { fb.className = 'feedback'; }, 3000);
        }

        renderPlayers();
    </script>
</body>
</html>
